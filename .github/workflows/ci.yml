name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pinned to an exact patch, not a floating "3.13". The app ships its
          # own interpreter via PyInstaller, so matching the dev machine
          # exactly is what we actually want -- and a floating patch is how a
          # robots.txt bug once passed locally on 3.13.7 and failed on CI's
          # 3.13.15 (see ADR 0003). Bump this deliberately, not implicitly.
          python-version: "3.13.7"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check placeinator tests migrations
      - run: python -m mypy placeinator
      # No Python lockfile exists (see pyproject.toml's plain version ranges) --
      # pip-audit with no requirements file audits the environment actually
      # resolved and installed by the step above, which is the real
      # equivalent of "locked" dependencies here. Fails on any known
      # vulnerability (no severity flag exists in pip-audit, unlike npm
      # audit's --audit-level, since OSV/PyPA advisories don't uniformly
      # carry a CVSS score to filter on) -- the Python-side counterpart to
      # the frontend's `npm audit` gate below. --skip-editable excludes the
      # local `placeinator` package itself, which isn't published to PyPI
      # and can't be looked up.
      - run: python -m pip_audit --skip-editable
      # "not live and not model" is the default in pyproject: job-source
      # adapters and the real embedding model are both opt-in.
      - run: python -m pytest tests/ -q
      # The model suite is a REQUIRED gate, not advisory. It was previously
      # scoped to test_scoring.py with continue-on-error, which meant the M1
      # end-to-end acceptance suite and every API-level job test -- 20+ tests,
      # the ones covering the paths a user actually exercises -- never ran in
      # CI at all. It downloads the ~64 MB embedding model once per run
      # (fastembed's loader is lru_cached, so it is one download for the whole
      # session, not one per test).
      #
      # "and not tex" excludes the Tectonic-backed PDF compile tests even
      # though some are also model-marked -- Tectonic's own first-ever-compile
      # format bootstrap can take several minutes on a slow connection (see
      # placeinator/latex/compile.py), which is a real CI reliability cost the
      # `model` gate's one ~64 MB download doesn't have. Manual-only, same
      # spirit as `live`, not a lesser check.
      - run: python -m pytest tests/ -m "model and not tex" -q
      # `live` tests stay opt-in: they hit real third-party job boards, so a
      # site being down is not this repo's build failing. `tex` tests stay
      # opt-in for the reason above.

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # --locked: Cargo.lock is tracked, so a drifted lockfile fails the
      # build here rather than silently resolving new dependency versions.
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Fails the build on a newly-disclosed advisory in a production dep.
      - run: npm audit --omit=dev --audit-level=moderate
