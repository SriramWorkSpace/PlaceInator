name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check placeinator tests migrations
      - run: python -m mypy placeinator
      # "not live and not model" is the default in pyproject: job-source
      # adapters and the real embedding model are both opt-in.
      - run: python -m pytest tests/ -q
      # Downloads the real ~130 MB embedding model on every run (no cache
      # configured for it yet) -- allowed to fail on transient Hugging Face
      # Hub issues without blocking the required checks above.
      - run: python -m pytest tests/integration/test_scoring.py -m model -q
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Fails the build on a newly-disclosed advisory in a production dep.
      - run: npm audit --omit=dev --audit-level=moderate
