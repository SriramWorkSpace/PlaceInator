[project]
name = "placeinator"
version = "0.1.0"
description = "PlaceInator sidecar: matching, document intelligence, and placement automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
matching = [
    "fastembed>=0.4",
    "numpy>=1.26",
    "rapidfuzz>=3.10",
]
documents = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pylatexenc>=2.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["placeinator*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; reformatting generated migrations only creates churn and
# makes the diff against a regenerated file unreadable.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external services (opt-in, deselected by default)",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
